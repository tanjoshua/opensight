services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opensight
      POSTGRES_PASSWORD: opensight
      POSTGRES_DB: opensight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensight -d opensight"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
