version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: opensight/internal/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["./web/node_modules/.bin/protoc-gen-es"]
    out: web/src/gen
    opt:
      - target=ts
      # web/tsconfig.app.json sets erasableSyntaxOnly, which rejects the plain
      # TS `enum` this plugin emits by default; this option switches it to an
      # `as const` object instead.
      - erasable_syntax=true
  - local: ["./web/node_modules/.bin/protoc-gen-connect-query"]
    out: web/src/gen
    opt: target=ts
