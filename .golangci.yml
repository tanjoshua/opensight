version: "2"

linters:
  default: standard
  exclusions:
    paths:
      # npm packages can ship Go source (e.g. flatted); never lint them.
      - web/node_modules
      # Generated protobuf/Connect code; not ours to style.
      - internal/gen
      # Generated sqlc code; not ours to style.
      - internal/store/sqlc
