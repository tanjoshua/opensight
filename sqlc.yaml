version: "2"
sql:
  # All application persistence. Schema is the goose migrations
  # themselves (internal/store/migrations/*.sql) replayed in order — sqlc
  # applies each file's "-- +goose Up" section only, so the generated types
  # reflect the live schema (dropped columns/tables included), not just the
  # latest migration. `make sqlc` regenerates; CI fails on any diff, same as
  # `make proto`.
  - schema: "internal/store/migrations"
    queries: "internal/store/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        # Every base type used by internal/metrics's queries gets an explicit
        # non-null and nullable override below (structured go_type form for
        # the nullable/pointer side — the "*string" bare-string shorthand
        # isn't accepted for basic types), rather than relying on
        # emit_pointers_for_null_types, which double-wraps a nullable
        # override that already names a pointer type and silently no-ops on
        # one that doesn't. The result matches store.*'s existing style:
        # plain domain.ID/string/int for NOT NULL columns, *string/*int/
        # *time.Time for nullable ones, instead of
        # pgtype.UUID/pgtype.Timestamptz/pgtype.Text/...
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            go_type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "int4"
            go_type: "int32"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "int8"
            go_type: "int64"
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "float8"
            go_type: "float64"
          - db_type: "float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "bool"
            go_type: "bool"
          - db_type: "bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
