[defaults]
inventory = inventory/hosts.yml
remote_user = deploy
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
roles_path = roles
# host_group_vars is the built-in group_vars/host_vars loader; community.sops.sops
# is what transparently decrypts *.sops.yml files it finds alongside them (e.g.
# secrets.sops.yml) — no explicit decrypt step in any playbook.
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
pipelining = True
