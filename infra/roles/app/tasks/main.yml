---
- name: Ensure OpenSight directory exists
  ansible.builtin.file:
    path: "{{ opensight_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Render application files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ opensight_dir }}/{{ item.dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: env.j2, dest: .env, mode: "0600" }
    - { src: compose.yml.j2, dest: compose.yml, mode: "0644" }
    - { src: Caddyfile.j2, dest: Caddyfile, mode: "0644" }

- name: Log in to GHCR
  ansible.builtin.shell:
    cmd: "echo {{ ghcr_pat | quote }} | docker login ghcr.io -u {{ ghcr_username }} --password-stdin"
  no_log: true
  changed_when: true

- name: Pull images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ opensight_dir }}"
  changed_when: true

- name: Bring up PostgreSQL
  ansible.builtin.command:
    cmd: docker compose up -d --wait postgres
    chdir: "{{ opensight_dir }}"
  changed_when: true

- name: Stop the app before database migrations
  ansible.builtin.command:
    cmd: docker compose stop app
    chdir: "{{ opensight_dir }}"
  changed_when: true
  failed_when: false

- name: Run application and River migrations
  ansible.builtin.command:
    cmd: docker compose run --rm app migrate
    chdir: "{{ opensight_dir }}"
  changed_when: true

- name: Bring up the full stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ opensight_dir }}"
  changed_when: true

- name: Verify the app is serving
  ansible.builtin.uri:
    url: "https://{{ domain }}/healthz"
    return_content: true
    status_code: 200
  register: healthz
  until: healthz.status == 200 and 'ok' in healthz.content
  retries: 10
  delay: 3
