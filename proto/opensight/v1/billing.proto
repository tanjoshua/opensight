syntax = "proto3";

package opensight.v1;

import "google/protobuf/timestamp.proto";
import "opensight/v1/common.proto";

message GetBillingRequest {}

enum BillingAction {
  BILLING_ACTION_UNSPECIFIED = 0;
  BILLING_ACTION_NONE = 1;
  BILLING_ACTION_CHECKOUT = 2;
  BILLING_ACTION_PORTAL = 3;
}

message GetBillingResponse {
  Access access = 1;
  Plan plan = 2;
  // stripe_status is VERBATIM Stripe status, empty when the account has no
  // subscription. The SPA maps it to copy; it is never invented locally
  // (design 08 — subscriptions.stripe_status).
  string stripe_status = 3;
  // price_unit_amount is minor units (e.g. 5000 for S$50.00), fetched live
  // from Stripe rather than a constant — Stripe Prices are immutable, so a
  // displayed price can never disagree with the charge.
  int64 price_unit_amount = 4;
  string price_currency = 5;
  string price_interval = 6;
  // current_period_end and cancel_at_period_end together carry the
  // "renewal or end date": current_period_end is the renewal date when
  // cancel_at_period_end is false, and the end date when it is true.
  google.protobuf.Timestamp current_period_end = 7;
  bool cancel_at_period_end = 8;
  // comped accounts have no Stripe objects at all (design 08 "comped is a
  // separate boolean, not a status value") — stripe_status is empty and
  // there is no portal to offer.
  bool comped = 9;
  // action is derived server-side from the account's subscription. The SPA
  // does not interpret Stripe statuses to decide whether to create a new
  // subscription or manage the existing one.
  BillingAction action = 10;
}

// StartCheckoutRequest is deliberately empty. The plan being paid for is the
// one already on the account's subscriptions row, and its Price id is resolved
// from the code catalog plus config — a client-supplied plan or price would be
// a way to buy something we never offered.
message StartCheckoutRequest {}

message StartCheckoutResponse {
  // checkout_url is the Stripe-hosted Checkout page. The SPA navigates to it;
  // it is never fetched or framed.
  string checkout_url = 1;
}

message ConfirmCheckoutRequest {
  // session_id is the value Stripe substituted for {CHECKOUT_SESSION_ID} in
  // success_url. It is proof of nothing on its own: the server retrieves the
  // session and confirms its account belongs to the caller.
  string session_id = 1;
}

message ConfirmCheckoutResponse {
  // access after the same reconcile the webhook runs (design 08 "Checkout
  // return") — so a customer who just paid is never told they haven't while a
  // webhook is in flight.
  Access access = 1;
  // account_slug is the account Stripe identified via client_reference_id.
  // Checkout confirmation is identity-scoped so outstanding pre-account-path
  // success URLs can route into the correct account after reconciliation.
  string account_slug = 2;
}

// CreatePortalSessionRequest is deliberately empty, the same shape as
// StartCheckoutRequest: the Customer to send is the calling account's own, not
// a client-supplied id.
message CreatePortalSessionRequest {}

message CreatePortalSessionResponse {
  // portal_url is the Stripe-hosted portal. The SPA navigates to it; it is
  // never fetched or framed.
  string portal_url = 1;
}

service BillingService {
  rpc GetBilling(GetBillingRequest) returns (GetBillingResponse);
  rpc StartCheckout(StartCheckoutRequest) returns (StartCheckoutResponse);
  rpc ConfirmCheckout(ConfirmCheckoutRequest) returns (ConfirmCheckoutResponse);
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (CreatePortalSessionResponse);
}
