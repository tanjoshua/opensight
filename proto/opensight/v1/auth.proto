syntax = "proto3";

package opensight.v1;

import "opensight/v1/account.proto";

message User {
  string id = 1;
  string email = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  repeated AccountMembershipSummary memberships = 7;
  reserved 2, 3, 4, 5, 6;
  reserved "tenant", "businesses", "prompt_limit", "access", "plan";
}

// Sign-in itself is not an RPC: Google authentication is a plain HTTP
// redirect flow (/auth/google/start, /auth/google/callback — see design 06),
// not a Connect call, so there is no public procedure on this service.
service AuthService {
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}
