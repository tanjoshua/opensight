syntax = "proto3";

package opensight.v1;

import "opensight/v1/common.proto";

message User {
  string id = 1;
  string email = 2;
}

message Tenant {
  string id = 1;
  string name = 2;
}

// LoginRequest carries a credential (password) and must never be logged in
// full — relevant to any future logging/observability interceptor.
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  Tenant tenant = 2;
}

// SignupRequest carries a credential (password) and must never be logged in
// full — relevant to any future logging/observability interceptor.
message SignupRequest {
  string email = 1;
  string password = 2;
}

message SignupResponse {
  User user = 1;
  Tenant tenant = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  Tenant tenant = 2;
  repeated BusinessSummary businesses = 3;
  // Field 4's old bare prompt_limit is superseded by access + plan: the SPA
  // needs the billing state and complete plan, not one entitlement number.
  reserved 4;
  reserved "prompt_limit";
  Access access = 5;
  Plan plan = 6;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Signup(SignupRequest) returns (SignupResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}
