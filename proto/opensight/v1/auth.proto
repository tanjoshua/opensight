syntax = "proto3";

package opensight.v1;

import "opensight/v1/common.proto";

message User {
  string id = 1;
  string email = 2;
}

message Tenant {
  string id = 1;
  string name = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  Tenant tenant = 2;
  repeated BusinessSummary businesses = 3;
  // Field 4's old bare prompt_limit is superseded by access + plan: the SPA
  // needs the billing state and complete plan, not one entitlement number.
  reserved 4;
  reserved "prompt_limit";
  Access access = 5;
  Plan plan = 6;
}

// Sign-in itself is not an RPC: Google authentication is a plain HTTP
// redirect flow (/auth/google/start, /auth/google/callback — see design 06),
// not a Connect call, so there is no public procedure on this service.
service AuthService {
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}
