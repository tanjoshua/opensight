syntax = "proto3";

package opensight.v1;

enum OpportunityStatus {
  OPPORTUNITY_STATUS_UNSPECIFIED = 0;
  OPPORTUNITY_STATUS_OPEN = 1;
  OPPORTUNITY_STATUS_IN_PROGRESS = 2;
  OPPORTUNITY_STATUS_COMPLETED = 3;
  OPPORTUNITY_STATUS_DISMISSED = 4;
}

enum DismissalReason {
  DISMISSAL_REASON_UNSPECIFIED = 0;
  DISMISSAL_REASON_NOT_RELEVANT = 1;
  DISMISSAL_REASON_ALREADY_DONE = 2;
  DISMISSAL_REASON_NOT_ACTIONABLE = 3;
  DISMISSAL_REASON_TOO_MUCH_EFFORT = 4;
  DISMISSAL_REASON_OTHER = 5;
}

enum OpportunityBlockType {
  OPPORTUNITY_BLOCK_TYPE_UNSPECIFIED = 0;
  OPPORTUNITY_BLOCK_TYPE_TEXT = 1;
  OPPORTUNITY_BLOCK_TYPE_METRIC = 2;
  OPPORTUNITY_BLOCK_TYPE_LINK = 3;
  OPPORTUNITY_BLOCK_TYPE_QUESTION_LIST = 4;
  OPPORTUNITY_BLOCK_TYPE_EVIDENCE_LIST = 5;
  OPPORTUNITY_BLOCK_TYPE_NOTICE = 6;
}

message OpportunityBlock {
  OpportunityBlockType type = 1;
  string title = 2;
  string text = 3;
  string value = 4;
  string url = 5;
  repeated string items = 6;
  repeated string result_ids = 7;
}

message OutcomeObservation {
  string assessment_status = 1;
  string observed_at = 2;
  repeated string result_ids = 3;
  repeated string prompt_ids = 4;
}

message Opportunity {
  string id = 1;
  string practice_key = 2;
  string subject_key = 3;
  string title = 4;
  string summary = 5;
  string effort = 6;
  repeated OpportunityBlock blocks = 7;
  OpportunityStatus status = 8;
  DismissalReason dismissal_reason = 9;
  string assessment_status = 10;
  reserved 11;
  reserved "confidence";
  repeated string result_ids = 12;
  repeated string prompt_ids = 13;
  repeated string checked_sources = 14;
  string assessed_at = 15;
  bool focus = 16;
  repeated OutcomeObservation observations = 17;
  // The newest assessment generation still produced this opportunity.
  bool current = 18;
  // The practice is a prerequisite that blocks the others while unmet. Set
  // from the practice catalog so the UI never has to know a practice key.
  bool direct_blocker = 19;
}

message ListOpportunitiesRequest {
  string business_id = 1;
}
message ListOpportunitiesResponse {
  repeated Opportunity opportunities = 1;
}
message GetOpportunityRequest {
  string opportunity_id = 1;
}
message GetOpportunityResponse {
  Opportunity opportunity = 1;
}
message SetOpportunityStatusRequest {
  string opportunity_id = 1;
  OpportunityStatus status = 2;
  DismissalReason dismissal_reason = 3;
}
message SetOpportunityStatusResponse {
  Opportunity opportunity = 1;
}

service OpportunityService {
  rpc ListOpportunities(ListOpportunitiesRequest) returns (ListOpportunitiesResponse);
  rpc GetOpportunity(GetOpportunityRequest) returns (GetOpportunityResponse);
  rpc SetOpportunityStatus(SetOpportunityStatusRequest) returns (SetOpportunityStatusResponse);
}
