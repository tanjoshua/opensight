syntax = "proto3";

package opensight.v1;

import "google/protobuf/timestamp.proto";

// CheckOutcome is the verdict on one site-audit check.
enum CheckOutcome {
  CHECK_OUTCOME_UNSPECIFIED = 0;
  CHECK_OUTCOME_PASS = 1;
  CHECK_OUTCOME_FAIL = 2;
  CHECK_OUTCOME_COULD_NOT_VERIFY = 3;
  CHECK_OUTCOME_NOT_APPLICABLE = 4;
  CHECK_OUTCOME_NOT_ASSESSED = 5;
}

// ActionStatus is the whole lifecycle of a piece of work. An action stops being
// shown when the evidence stops producing it, so there is no retired state.
enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_OPEN = 1;
  ACTION_STATUS_DONE = 2;
  ACTION_STATUS_DISMISSED = 3;
}

enum DismissalReason {
  DISMISSAL_REASON_UNSPECIFIED = 0;
  DISMISSAL_REASON_NOT_RELEVANT = 1;
  DISMISSAL_REASON_ALREADY_DONE = 2;
  DISMISSAL_REASON_NOT_ACTIONABLE = 3;
  DISMISSAL_REASON_TOO_MUCH_EFFORT = 4;
  DISMISSAL_REASON_OTHER = 5;
}

// ActionsEmptyReason distinguishes the three ways the work queue can be empty.
// They are not interchangeable: NO_FINDINGS is the absence of evidence, while
// NOT_ASSESSED_YET means nothing has been checked at all.
enum ActionsEmptyReason {
  ACTIONS_EMPTY_REASON_UNSPECIFIED = 0;
  ACTIONS_EMPTY_REASON_NO_FINDINGS = 1;
  ACTIONS_EMPTY_REASON_NOT_ASSESSED_YET = 2;
}

// Check is one assertion, joined from the catalog definition (title, what) and
// the audit result (outcome, detail).
message Check {
  string key = 1;
  string title = 2;
  string what = 3;
  CheckOutcome outcome = 4;
  string outcome_label = 5;
  string detail = 6;
  // informational checks report a fact the user may legitimately have chosen.
  // They never count towards passed or failed.
  bool informational = 7;
}

message CheckCount {
  CheckOutcome outcome = 1;
  int32 count = 2;
}

// CheckGroup orders the checklist and carries the "why this matters" copy. It
// has no standing of its own — only counts.
message CheckGroup {
  string key = 1;
  string title = 2;
  string description = 3;
  repeated string references = 4;
  repeated Check checks = 5;
  int32 checks_passed = 6;
  int32 checks_total = 7;
}

// ImprovementAction is one finding as the UI presents it. Go calls it a
// Finding; the user-facing word is an action.
message ImprovementAction {
  string id = 1;
  string key = 2;
  string source = 3;
  string title = 4;
  string body = 5;
  repeated string steps = 6;
  string detail = 7;
  repeated string result_ids = 8;
  repeated string prompt_ids = 9;
  repeated string sources = 10;
  bool blocking = 11;
  int32 reach = 12;
  ActionStatus status = 13;
  DismissalReason dismissal_reason = 14;
  google.protobuf.Timestamp first_seen_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  // 17 was verified_at, which stamped a completed action the next run stopped
  // reproducing. Whether work actually changed visibility is a question the
  // product does not answer yet, and a re-check of the finding was never an
  // answer to it.
  reserved 17;
  // category is the kind of change the action asks for, and the axis the work
  // queue filters on. Its key matches the checklist group for work on the
  // customer's own site; category_label is the word the user reads.
  string category = 18;
  string category_label = 19;
}

// ActionCategory is one entry of the work queue's filter: a kind of change and
// how much active work currently asks for it. Only categories with active work
// appear, in catalog order, so the filter never offers an empty bucket and
// never reshuffles between visits.
message ActionCategory {
  string key = 1;
  string label = 2;
  int32 count = 3;
}

message ListActionsRequest {
  string business_id = 1;
}

message ListActionsResponse {
  reserved 2;
  reserved "additional_actions";
  // actions is the whole active queue in rank order. There is no lead section:
  // a fixed cutoff claimed a priority boundary the ranking does not have, and
  // could push a blocker under a heading that reads as optional.
  repeated ImprovementAction actions = 1;
  repeated ImprovementAction resolved_actions = 3;
  ActionsEmptyReason empty_reason = 4;
  google.protobuf.Timestamp checked_at = 5;
  repeated ActionCategory categories = 6;
}

message GetActionRequest {
  string action_id = 1;
}

message GetActionResponse {
  ImprovementAction action = 1;
}

message SetActionStatusRequest {
  string action_id = 1;
  ActionStatus status = 2;
  DismissalReason dismissal_reason = 3;
}

message SetActionStatusResponse {
  ImprovementAction action = 1;
}

message GetChecklistRequest {
  string business_id = 1;
}

message GetChecklistResponse {
  reserved 1, 2, 3;
  reserved "counts", "freshness", "sections";
  repeated CheckCount check_counts = 4;
  repeated CheckGroup groups = 5;
  google.protobuf.Timestamp checked_at = 6;
  int32 pages_read = 7;
  // failure is set when the site could not be crawled at all, in which case
  // every check reports as could-not-verify rather than as a shortfall.
  string failure = 8;
  bool assessed = 9;
}

service ImproveService {
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  rpc GetAction(GetActionRequest) returns (GetActionResponse);
  rpc SetActionStatus(SetActionStatusRequest) returns (SetActionStatusResponse);
  rpc GetChecklist(GetChecklistRequest) returns (GetChecklistResponse);
}
