syntax = "proto3";

package opensight.v1;

import "google/protobuf/timestamp.proto";

enum PracticeMode {
  PRACTICE_MODE_UNSPECIFIED = 0;
  PRACTICE_MODE_CHECK = 1;
  PRACTICE_MODE_CONTINUOUS = 2;
  PRACTICE_MODE_TRACKED = 3;
}

enum ChecklistStanding {
  CHECKLIST_STANDING_UNSPECIFIED = 0;
  CHECKLIST_STANDING_GOOD = 1;
  CHECKLIST_STANDING_IMPROVABLE = 2;
  CHECKLIST_STANDING_NEEDS_ATTENTION = 3;
  CHECKLIST_STANDING_TRACKING = 4;
  CHECKLIST_STANDING_COULD_NOT_VERIFY = 5;
  CHECKLIST_STANDING_NOT_ASSESSED = 6;
  CHECKLIST_STANDING_NOT_APPLICABLE = 7;
  CHECKLIST_STANDING_NO_LONGER_TRACKED = 8;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_OPEN = 1;
  ACTION_STATUS_IN_PROGRESS = 2;
  ACTION_STATUS_COMPLETED = 3;
  ACTION_STATUS_DISMISSED = 4;
  ACTION_STATUS_RETIRED = 5;
  ACTION_STATUS_SUPERSEDED = 6;
}

enum DismissalReason {
  DISMISSAL_REASON_UNSPECIFIED = 0;
  DISMISSAL_REASON_NOT_RELEVANT = 1;
  DISMISSAL_REASON_ALREADY_DONE = 2;
  DISMISSAL_REASON_NOT_ACTIONABLE = 3;
  DISMISSAL_REASON_TOO_MUCH_EFFORT = 4;
  DISMISSAL_REASON_OTHER = 5;
}

enum ActionBlockType {
  ACTION_BLOCK_TYPE_UNSPECIFIED = 0;
  ACTION_BLOCK_TYPE_TEXT = 1;
  ACTION_BLOCK_TYPE_METRIC = 2;
  ACTION_BLOCK_TYPE_LINK = 3;
  ACTION_BLOCK_TYPE_QUESTION_LIST = 4;
  ACTION_BLOCK_TYPE_EVIDENCE_LIST = 5;
  ACTION_BLOCK_TYPE_NOTICE = 6;
}

enum ActionsEmptyReason {
  ACTIONS_EMPTY_REASON_UNSPECIFIED = 0;
  ACTIONS_EMPTY_REASON_HEALTHY = 1;
  ACTIONS_EMPTY_REASON_INCOMPLETE_CHECKS = 2;
  ACTIONS_EMPTY_REASON_INSUFFICIENT_CAPABILITY = 3;
}

message AssessmentFreshness {
  bool available = 1;
  bool partial = 2;
  bool stale = 3;
  google.protobuf.Timestamp assessed_at = 4;
}

message ActionBlock {
  ActionBlockType type = 1;
  string title = 2;
  string text = 3;
  string value = 4;
  string url = 5;
  repeated string items = 6;
  repeated string result_ids = 7;
}

message ActionCycle {
  string id = 1;
  int32 cycle = 2;
  ActionStatus status = 3;
  google.protobuf.Timestamp first_seen_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}

message ImprovementAction {
  string id = 1;
  string practice_key = 2;
  string subject_key = 3;
  int32 cycle = 4;
  string recommendation_key = 5;
  string title = 6;
  string summary = 7;
  string effort = 8;
  repeated ActionBlock blocks = 9;
  ActionStatus status = 10;
  DismissalReason dismissal_reason = 11;
  ChecklistStanding standing = 12;
  repeated string result_ids = 13;
  repeated string prompt_ids = 14;
  repeated string checked_sources = 15;
  google.protobuf.Timestamp assessed_at = 16;
  bool fresh = 17;
  repeated ActionCycle cycles = 18;
}

message ChecklistActionHistory {
  string action_id = 1;
  int32 cycle = 2;
  ActionStatus status = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ChecklistSubject {
  string subject_key = 1;
  string label = 2;
  ChecklistStanding standing = 3;
  string standing_label = 4;
  string explanation = 5;
  repeated string result_ids = 6;
  repeated string prompt_ids = 7;
  repeated string checked_sources = 8;
  google.protobuf.Timestamp last_successful_check = 9;
  bool stale = 10;
  ImprovementAction current_action = 11;
  repeated ChecklistActionHistory action_history = 12;
}

message ChecklistPractice {
  string key = 1;
  string title = 2;
  string description = 3;
  string why = 4;
  PracticeMode mode = 5;
  repeated string references = 6;
  repeated ChecklistSubject subjects = 7;
  ChecklistStanding standing = 8;
  string standing_label = 9;
}

message ChecklistSection {
  string title = 1;
  repeated ChecklistPractice practices = 2;
}

message StandingCount {
  ChecklistStanding standing = 1;
  int32 count = 2;
}

message ActivityEvent {
  string id = 1;
  string action_id = 2;
  string practice_key = 3;
  string subject_key = 4;
  string title = 5;
  int32 cycle = 6;
  string event_type = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListActionsRequest {
  string business_id = 1;
}
message ListActionsResponse {
  repeated ImprovementAction focus_actions = 1;
  repeated ImprovementAction additional_actions = 2;
  AssessmentFreshness freshness = 3;
  ActionsEmptyReason empty_reason = 4;
}
message GetActionRequest {
  string action_id = 1;
}
message GetActionResponse {
  ImprovementAction action = 1;
}
message SetActionStatusRequest {
  string action_id = 1;
  ActionStatus status = 2;
  DismissalReason dismissal_reason = 3;
}
message SetActionStatusResponse {
  ImprovementAction action = 1;
}
message GetChecklistRequest {
  string business_id = 1;
}
message GetChecklistResponse {
  repeated StandingCount counts = 1;
  AssessmentFreshness freshness = 2;
  repeated ChecklistSection sections = 3;
}
message ListActivityRequest {
  string business_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListActivityResponse {
  repeated ActivityEvent events = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

service ImproveService {
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  rpc GetAction(GetActionRequest) returns (GetActionResponse);
  rpc SetActionStatus(SetActionStatusRequest) returns (SetActionStatusResponse);
  rpc GetChecklist(GetChecklistRequest) returns (GetChecklistResponse);
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
}
