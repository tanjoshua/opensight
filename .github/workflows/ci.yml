name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test And Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opensight
          POSTGRES_PASSWORD: opensight
          POSTGRES_DB: opensight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensight -d opensight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CI tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Check generated code is up to date
        run: make proto && make sqlc && make check-sql && git diff --exit-code

      - name: Test
        run: make test

      # Applies migrations to the Postgres service, then runs the DB-backed
      # tests that skip themselves without OPENSIGHT_STORE_TEST_DATABASE_URL.
      - name: Integration test
        run: make test-integration

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract sha tag
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | grep -oP '(?<=:)sha-[0-9a-f]+' | head -n1)
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://dashboard.opensight.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -sSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Install Ansible
        run: |
          pipx install --include-deps ansible
          ansible-galaxy collection install -r infra/requirements.yml

      - name: Configure deploy SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/opensight_vps1
          chmod 600 ~/.ssh/opensight_vps1

      - name: Deploy
        working-directory: infra
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ansible-playbook deploy.yml -e app_image_tag=${{ needs.image.outputs.image_tag }}
